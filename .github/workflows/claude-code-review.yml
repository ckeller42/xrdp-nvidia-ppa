# Automatic Claude review of every PR opened/updated in this fork.
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this pull request. Focus on:
            correctness and root cause, thread/process lifecycle, error handling, portability
            (Ubuntu noble/resolute), Debian packaging policy, shell script robustness, and whether the commit message explains
            the problem, reproduction and verification. Post the review with `gh pr comment`.
          claude_args: '--allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
